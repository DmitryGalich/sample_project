[package]
name = "users"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tonic = "0.11"
prost = "0.12"
anyhow = "1.0"
sqlx = { version = "0.7", features = [ "runtime-tokio-native-tls", "postgres", "uuid", "chrono" ] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tonic-build = "0.11"