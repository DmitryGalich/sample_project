version: '3.8'

services:
  gateway:
    image: nginx:1.27 
    container_name: gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - users
      - projects
    restart: unless-stopped
    networks:
      - internal_network

  users:
    build:
      context: ./users
      dockerfile: Dockerfile.prod
      # dockerfile: Dockerfile.dev
    container_name: users
    depends_on:
      users_db:
        condition: service_healthy
    expose:
      - "50051"
    environment:
      - EXPOSED_ADDR=${USERS_EXPOSED_ADDR:-0.0.0.0:50051}
      - DATABASE_URL=${USERS_DATABASE_URL:?USERS_DATABASE_URL is required}
    restart: unless-stopped
    networks:
      - internal_network

  users_db:
    image: postgres:16-alpine
    container_name: users_db
    environment:
      POSTGRES_USER: ${USERS_DB_USER:?USERS_DB_USER is required}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:?USERS_DB_PASSWORD is required}
      POSTGRES_DB: ${USERS_DB_NAME:-users_db}
    expose:
      - "5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d users_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internal_network

  projects:
    build:
      context: ./projects
      dockerfile: Dockerfile.prod
      # dockerfile: Dockerfile.dev
    container_name: projects
    depends_on:
      users_db:
        condition: service_healthy
    expose:
      - "50052"
    environment:
      - EXPOSED_ADDR=${PROJECTS_EXPOSED_ADDR:-0.0.0.0:50052}
      - DATABASE_URL=${PROJECTS_DATABASE_URL:?PROJECTS_DATABASE_URL is required}
    restart: unless-stopped
    networks:
      - internal_network

  projects_db:
    image: postgres:16-alpine
    container_name: projects_db
    environment:
      POSTGRES_USER: ${PROJECTS_DB_USER:?PROJECTS_DB_USER is required}
      POSTGRES_PASSWORD: ${PROJECTS_DB_PASSWORD:?PROJECTS_DB_PASSWORD is required}
      POSTGRES_DB: ${PROJECTS_DB_NAME:-projects_db}
    expose:
      - "5432"
    volumes:
      - projects_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d projects_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internal_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    ports:
      - "5050:80"
    depends_on:
      users_db:
        condition: service_healthy
      projects_db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal_network

volumes:
  users_db_data:
  projects_db_data:

networks:
  internal_network:
    driver: bridge
