
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s # Даем 10 секунд на инициализацию базы перед первой проверкой


    security_opt:
      - no-new-privileges:true


  keycloak:
    build:
      context: ./keycloak

    restart: unless-stopped

    command:
      - start
      - --optimized
      - --import-realm

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

      KC_HOSTNAME: ${KEYCLOAK_URL}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=50"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - keycloak_data:/opt/keycloak/data

    networks:
      - backend

    expose:
      - "8080"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080"
        ]
      interval: 15s
      timeout: 5s
      retries: 20

    security_opt:
      - no-new-privileges:true


  backend:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      OIDC_ISSUER: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
      OIDC_AUDIENCE: backend

    depends_on:
      keycloak:
        condition: service_healthy

    networks:
      - backend

    expose:
      - "8080"

    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3



  nginx:
    image: nginx:1.27
    restart: unless-stopped

    depends_on:
      keycloak:
        condition: service_healthy
      backend:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    networks:
      - backend

    security_opt:
      - no-new-privileges:true


volumes:
  postgres_data:
  keycloak_data:


networks:
  backend:
    driver: bridge