version: '3.8'

services:
  gateway:
    image: nginx:1.27 
    container_name: gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - users
    restart: unless-stopped
    networks:
      - internal_network

  users:
    build:
      context: ./users
      dockerfile: Dockerfile
    container_name: users
    depends_on:
      - users_db
    expose:
        - "50051"
    environment:
      - EXPOSED_ADDR=0.0.0.0:50051
      - DATABASE_URL=postgres://admin:admin@database:5432/users_db
    volumes:
      - ./users:/workspace/users:cached
    restart: unless-stopped
    networks:
        - internal_network

  users_db:
    image: postgres:16-alpine
    container_name: users_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: users_db
    expose:
      - "5432"
    volumes:
      - service_users_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - internal_network

