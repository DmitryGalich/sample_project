
services:
  gateway:
    image: nginx:1.27
    restart: unless-stopped
    container_name: gateway
    ports:
      - "8080:80"
    networks:
      - internal_network
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro

  backend:
    build:
      context: ./backend
      # dockerfile: Dockerfile.prod
      dockerfile: Dockerfile.dev
    container_name: backend
    expose:
      - "50051"
    environment:
      - EXPOSED_ADDR=0.0.0.0:50051
    restart: unless-stopped
    networks:
      - internal_network
      
networks:
  internal_network:
    driver: bridge