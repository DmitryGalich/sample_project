events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;

    # 1. ПРАВКА: Переименовали upstream под наше новое имя сервиса в docker-compose
    upstream messenger_backend {
        server messenger:50051;
    }

    server {
        listen 8080;
        http2 on; 

        server_name localhost;

        location /messenger.MessengerCoreService/ {
            grpc_pass grpc://messenger_backend;
            
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
        }

        location / {
            return 404;
        }
    }
}
