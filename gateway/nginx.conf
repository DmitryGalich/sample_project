# events — это секция, которая управляет сетевыми подключениями на низком уровне.
events {
    # worker_connections 1024; — указывает, что один рабочий процесс Nginx может одновременно обслуживать до 1024 соединений 
    # (включая запросы от клиентов и соединения с бэкендами)
    worker_connections 1024;
}

http {
    # По умолчанию Nginx общается с бэкендами по старому протоколу HTTP/1.0. 
    # Эта строка принудительно включает HTTP/1.1.
    # Зачем: HTTP/1.1 позволяет повторно использовать одно и то же сетевое соединение для множества запросов (Keep-Alive), 
    # что критически важно для производительности и работы веб-сокетов.
    proxy_http_version 1.1;

    # $host — это встроенная переменная Nginx, которая содержит домен или IP-адрес, 
    # который ввел пользователь в браузере (в нашем случае localhost).
    # Эта строка говорит: "Когда пересылаешь запрос в Rust или Keycloak, передай им оригинальное имя хоста, которое запрашивал клиент". 
    # Без этого бэкенд будет думать, что к нему обращаются по внутреннему Docker-имени (например, http://rust_backend:8000).
    proxy_set_header Host $host;

    # $remote_addr — реальный IP-адрес пользователя, который сделал запрос.
    # Так как Rust-бэкенд находится «за забором» Nginx внутри Docker-сети, для него все запросы технически будут приходить с IP-адреса Nginx. 
    # Эта строка сохраняет настоящий IP-адрес клиента в специальный заголовок X-Real-IP.
    proxy_set_header X-Real-IP $remote_addr;

    # Это стандарт де-факто для прокси-серверов. Если запрос прошел через цепочку из нескольких прокси, 
    # этот заголовок соберет их все в список через запятую: [IP_клиента, IP_первого_прокси, IP_второго_прокси].
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # $scheme — протокол, по которому пришел запрос (http или https).
    # Зачем это Keycloak: Keycloak очень строг к безопасности. Если клиент зашел по https, Keycloak должен знать об этом, 
    # чтобы генерировать безопасные ссылки (например, редиректы). 
    # Этот заголовок сообщает Keycloak, защищено ли исходное соединение.
    proxy_set_header X-Forwarded-Proto $scheme;

    # Виртуальный сервер (Контекст server)
    server {
        # Объявляет конфигурацию для конкретного веб-сайта или порта.

        # listen 80; — заставляет Nginx слушать стандартный порт 80 (обычный HTTP-трафик). 
        # Теперь именно этот порт мы открыли наружу в docker-compose.yml.
        listen 80;

        server_name localhost;

        location /gateway_health {
            return 200 "gateway_health";
        }

        # location /api/ — это правило маршрутизации (роутинг). Оно говорит: 
        # "Если URL запроса начинается с /api/ 
        # (например, http://localhost/api/protected), то выполняй правила внутри этих скобок".
        location /api/ {

            # proxy_pass — самая главная команда. Она берет запрос и перенаправляет (проксирует) его на другой сервер.
            # Поскольку контейнеры находятся в одной Docker-сети internal_network, 
            # Nginx может обращаться к бэкенду напрямую по имени его сервиса — rust_backend:8000.
            proxy_pass http://backend:8000/;

            # КРИТИЧЕСКИ ВАЖНО: Передаем заголовок Authorization дальше

            # $http_authorization — это переменная, куда Nginx автоматически складывает значение входящего заголовка Authorization от клиента.
            # Теория: По умолчанию Nginx при proxy_pass может отрезать или модифицировать некоторые заголовки. 
            # Данной строкой мы явно приказываем: "Nginx, возьми заголовок Authorization: Bearer <токен>, который прислал Иван, 
            # и в неизменном виде перешли его дальше в Rust!". 
            # Без этой строки наш бэкенд на Rust всегда получал бы пустой заголовок и возвращал 401 Unauthorized.
            proxy_set_header Authorization $http_authorization;
        }

        location /auth/ {
            # Очищаем префикс /auth/ перед отправкой в Keycloak, если это необходимо,
            # но в Keycloak 26+ пути по умолчанию начинаются сразу с /realms.
            # Поэтому мы просто перенаправляем поток на контейнер keycloak

            # Обратите внимание на косую черту / в конце http://keycloak:8080/. 
            # В синтаксисе Nginx это означает срез префикса.
            # Если пользователь запрашивает http://localhost/auth/realms/..., 
            # Nginx отрежет кусок /auth/ и отправит в Keycloak чистый путь /realms/.... 
            # Это позволяет нам сделать красивый единый домен, скрывая внутреннюю структуру папок Keycloak.
            proxy_pass http://keycloak:8080/;
        }

        location / {
            return 404;
        }  
    }
}