events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    
    server {
        listen 8080;
        http2 on; 

        server_name localhost;

        location / {
            return 200 "root";
        } 

        location /test {
            return 200 "test";
        } 
    }

